AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Zero site and same-origin accounts API with reversible viewer access policy over trusted HTTPS.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  AccountsApiHostname:
    Type: String
    AllowedPattern: '[a-z0-9]+\.execute-api\.us-east-2\.amazonaws\.com'
  EdgeSecretArn:
    Type: String
    AllowedPattern: 'arn:[a-z0-9-]+:secretsmanager:us-east-2:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+'
  EvaluatorIp:
    Type: String
    AllowedPattern: '[0-9]{1,3}(\.[0-9]{1,3}){3}'
  SiteAccessMode:
    Type: String
    Default: evaluator-only
    AllowedValues: [evaluator-only, marketing-public, route-governed]

Conditions:
  RouteGovernedAccess: !Equals [!Ref SiteAccessMode, route-governed]

Resources:
  Website:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  WebsiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Ref AWS::StackName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  EvaluatorAccess:
    Type: AWS::CloudFront::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Separate public site and identity routes from server-authorized account operations.
        must: Keep the evaluator-only rollback intact and enforce all permissions in the origin.
    Properties:
      Name: !Sub '${AWS::StackName}-access'
      AutoPublish: true
      FunctionConfig:
        Comment: Govern Customer Zero routes and keep account permissions at the origin
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var accountPages = ['/sign-in', '/signup', '/verify-email', '/recover', '/reset-password', '/account'];
        var marketingAssets = ['/', '/index.html', '/site.css', '/site.js',
          '/cloud-bracket.svg', '/favicon.svg', '/favicon.ico', '/instrument-sans.woff2', '/instrument-sans-OFL.txt'];
        var accountAssets = ['/account.css', '/account.js'];
        var authPrefix = '/api/cloud/auth/';
        var registry = /^\/api\/cloud\/v1\/organizations\/[a-fA-F0-9-]{36}\/projects(?:\/[a-z0-9][a-z0-9-]{0,47}\/applications)?$/;
        var workload = /^\/api\/cloud\/v1\/organizations\/[a-f0-9-]{36}\/projects\/[a-z0-9][a-z0-9-]{0,47}\/applications\/[a-z0-9][a-z0-9-]{0,47}\/environments\/[a-z0-9][a-z0-9-]{0,47}\/(?:inspection|published-releases|repository-binding|configuration(?:\/revisions\/[1-9][0-9]{0,9})?)$/;

        function response(status, description, type, method, body) {
          var result = { statusCode: status, statusDescription: description, headers: {
            'content-type': { value: type + '; charset=utf-8' },
            'cache-control': { value: 'no-store' },
            'x-content-type-options': { value: 'nosniff' },
            'referrer-policy': { value: 'no-referrer' },
            'strict-transport-security': { value: 'max-age=31536000' }
          }};
          if (method !== 'HEAD') result.body = body;
          return result;
        }

        function fault(status, description, code, request, isApi, heading, message) {
          if (isApi) return response(status, description, 'application/json', request.method, '{"error":"' + code + '"}');
          var result = response(status, description, 'text/html', request.method,
            '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width, initial-scale=1">' +
            '<title>' + heading + ' &middot; PAIGE Cloud</title><link rel="icon" href="/favicon.svg">' +
            '<link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/account.css"></head>' +
            '<body class="account-surface"><header class="account-header">' +
            '<a class="brand" href="/" aria-label="PAIGE Cloud home"><img src="/cloud-bracket.svg" alt="">' +
            '<strong>PAIGE Cloud</strong></a></header><main class="account-entry">' +
            '<h1>' + heading + '</h1><p>' + message + '</p><nav class="account-links" aria-label="Account options">' +
            '<a href="/">Back to PAIGE Cloud</a><a href="/sign-in">Sign in</a></nav></main></body></html>');
          result.headers['content-security-policy'] = { value: "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" };
          result.headers['x-frame-options'] = { value: 'DENY' };
          return result;
        }

        function signinRedirect(request) {
          var result = response(303, 'See Other', 'text/html', request.method, '');
          result.headers.location = { value: '/sign-in' };
          return result;
        }

        function hasSessionCookie(request) {
          var cookie = request.cookies && request.cookies['__Host-paige_cloud_session'];
          return cookie && typeof cookie.value === 'string' && cookie.value.length <= 3800 &&
            /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(cookie.value);
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var evaluator = event.viewer.ip === '${EvaluatorIp}';
          // Replace client input. The origin accepts this budget signal only through the trusted edge.
          request.headers['x-paige-viewer-ip'] = { value: event.viewer.ip };
          var reads = request.method === 'GET' || request.method === 'HEAD';
          var isApi = uri.indexOf('/api/') === 0;
          var accountPage = accountPages.indexOf(uri) !== -1;
          if ('${SiteAccessMode}' === 'marketing-public' && !evaluator) {
            if (reads && marketingAssets.indexOf(uri) !== -1) return request;
            return fault(403, 'Forbidden', 'evaluator_network_required', request, isApi,
              'Private preview', 'Account access is available from the approved evaluator connection.');
          }
          if ('${SiteAccessMode}' !== 'route-governed') {
            if (!evaluator) {
              if (isApi) return fault(403, 'Forbidden', 'evaluator_network_required', request, true, '', '');
              return response(403, 'Forbidden', 'text/plain', request.method, 'Open this page from the approved evaluator connection.');
            }
            if (accountPage) request.uri = '/account-entry.html';
            return request;
          }
          if (reads && (marketingAssets.indexOf(uri) !== -1 || accountAssets.indexOf(uri) !== -1)) return request;

          var auth = uri.indexOf(authPrefix) === 0 ? uri.slice(authPrefix.length) : '';
          if (reads && accountPage) {
            if (uri === '/account' && !hasSessionCookie(request)) return signinRedirect(request);
            request.uri = '/account-entry.html';
            return request;
          }
          if (request.method === 'POST' &&
              ['sign-up', 'verify-email', 'resend-code', 'sign-in', 'sign-out', 'recover', 'reset-password'].indexOf(auth) !== -1) return request;

          if (reads && uri === '/mission-control') {
            if (!hasSessionCookie(request)) return signinRedirect(request);
            return request;
          }
          if ((request.method === 'GET' && uri === '/api/cloud/v1/developer/capabilities') ||
              auth === 'account' || /^organizations(?:\/[a-fA-F0-9-]{36})?$/.test(auth) ||
              registry.test(uri) || workload.test(uri)) {
            if (!hasSessionCookie(request)) return fault(401, 'Unauthorized', 'sign_in_required', request, true, '', '');
            return request;
          }
          return fault(404, 'Not Found', 'not_found', request, isApi,
            'Page not found', 'Check the address or return to the PAIGE Cloud website.');
        }

  AccountsRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-accounts'
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-paige_cloud_session]
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, X-Paige-Viewer-IP]
        QueryStringsConfig:
          QueryStringBehavior: none

  BrowserSecurity:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"
            Override: true

  WebsitePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Website
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Website.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Edge}'

  Edge:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: !If [RouteGovernedAccess, true, false]
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: website
            DomainName: !GetAtt Website.RegionalDomainName
            OriginAccessControlId: !Ref WebsiteAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: accounts
            DomainName: !Ref AccountsApiHostname
            OriginCustomHeaders:
              - HeaderName: x-paige-cloud-edge
                HeaderValue: !Sub '{{resolve:secretsmanager:${EdgeSecretArn}:SecretString}}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          # AWS-managed CachingDisabled policy.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref BrowserSecurity
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/cloud/auth/*
            TargetOriginId: accounts
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref AccountsRequestPolicy
            ResponseHeadersPolicyId: !Ref BrowserSecurity
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
          - PathPattern: /api/cloud/v1/*
            TargetOriginId: accounts
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref AccountsRequestPolicy
            ResponseHeadersPolicyId: !Ref BrowserSecurity
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
          - PathPattern: /mission-control
            TargetOriginId: accounts
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref AccountsRequestPolicy
            ResponseHeadersPolicyId: !Ref BrowserSecurity
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SiteOrigin:
    Value: !Sub 'https://${Edge.DomainName}'
  WebsiteBucket:
    Value: !Ref Website
